<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Affiche magasin A4 paysage (photo) — Les Journées Privilège Pigeard (15 nov. – 29 déc. 2026)</title>
<!--
  Affiche A4 paysage pour le magasin, posée sur le présentoir des montures en
  promotion (« facing »), avec la photo du magasin en fond — même composition
  que le visuel 16:9 de l'écran vitrine (tomytonio/pigeard-site#49, retiré
  ensuite au profit du 9:16), demandée par le propriétaire le 2026-11-03.
  La version fond blanc (journees-privilege-2026-facing-a4-paysage.html) reste
  disponible : moins d'encre, sans marge visible sur imprimante de bureau.
  Rendu : node rendu-a4.mjs <ce fichier> <sortie.png> <sortie.pdf> paysage
  → PNG 3508×2480 (300 dpi) + PDF A4.

  Sources :
  - Offre, dates et mentions : planning éditorial novembre 2026 de l'agence
    My Client Is Rich (« RS-novembre-pigeard.pdf », page 3, post 2 du mardi
    10 novembre 2026). « une sélection » devient « cette sélection » : l'affiche
    désigne les montures du présentoir. Phrase « Une belle occasion de vous
    faire plaisir ou de faire un beau cadeau à l'approche des fêtes » : même
    post, mot pour mot.
  - Photo de fond (journees-privilege-2026-magasin-a4-paysage.jpg) : celle du
    visuel de la campagne, extraite du même PDF (3277×4096 px), bande A4
    paysage prise à 13 % du haut (3277×2317 px), agrandie à 3508×2480 px.
    Intérieur du magasin de Nogent-le-Rotrou (même décor que
    assets/photos/boutique-nogent-interieur.jpg).
  - Codes graphiques, couleurs (noir #000000, corail #FF635B, vert #6A7959,
    relevées au pixel sur le visuel) et police Poppins : voir
    journees-privilege-2026-facing-a4-paysage.html.
  - Logo : assets/brand/pigeard-logo-white.svg.
-->
<style>
  @font-face{font-family:'Poppins';font-weight:500;src:url(polices/poppins-500-latin.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-weight:600;src:url(polices/poppins-600-latin.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-weight:700;src:url(polices/poppins-700-latin.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-weight:800;src:url(polices/poppins-800-latin.woff2) format('woff2')}
  :root{
    --noir:#000000; --corail:#FF635B; --vert:#6A7959; --blanc:#FFFFFF;
    --police:'Poppins',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1754px;height:1240px;overflow:hidden}
  body{position:relative;background:#111 url(journees-privilege-2026-magasin-a4-paysage.jpg) center/cover no-repeat;
    color:var(--blanc);font-family:var(--police);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* Voiles : coin du logo, gauche (phrase) et bas (mentions) */
  .voile{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(560px 380px at 290px 170px, rgba(0,0,0,.55), rgba(0,0,0,0) 72%),
      linear-gradient(to right, rgba(0,0,0,.55) 0, rgba(0,0,0,.2) 42%, rgba(0,0,0,0) 64%),
      linear-gradient(to top, rgba(0,0,0,.8) 0, rgba(0,0,0,.42) 13%, rgba(0,0,0,0) 30%)}

  .logo{position:absolute;left:104px;top:92px;height:156px}

  .pile{position:absolute;left:104px;top:336px;display:flex;flex-direction:column;align-items:flex-start}
  .bande{color:var(--blanc);text-transform:uppercase;font-weight:700;line-height:1;white-space:nowrap}
  .b-journees{background:var(--noir);font-size:112px;letter-spacing:.025em;padding:30px 32px 16px 32px}
  .b-privilege{background:var(--corail);font-size:112px;letter-spacing:.025em;
    margin-left:58px;padding:32px 64px 18px 72px;
    clip-path:polygon(5% 7%, 97% 0, 100% 100%, 0 100%)}
  .b-dates{background:var(--vert);text-transform:none;font-weight:500;font-size:49px;
    letter-spacing:.005em;padding:15px 28px 11px 28px;margin-left:12px}

  .phrase{position:absolute;left:104px;top:888px;width:960px;display:flex;align-items:flex-start;gap:26px;
    font-size:38px;font-weight:600;line-height:1.3;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .phrase .ligne{flex:none;width:64px;height:6px;margin-top:24px;background:var(--corail)}

  .etoile{position:absolute;left:1000px;top:262px;width:700px;height:700px}
  .etoile svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(4deg)}
  .etoile .contenu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;transform:rotate(9deg);text-align:center;padding-bottom:6px}
  .etoile .taux{font-size:178px;font-weight:800;line-height:.9;letter-spacing:-.035em;margin-left:-10px}
  .etoile .sur{margin-top:16px;font-size:35px;font-weight:700;line-height:1.08;text-transform:uppercase;
    letter-spacing:.03em}

  .mentions{position:absolute;left:104px;right:104px;bottom:62px;font-size:22px;font-weight:500;
    color:rgba(255,255,255,.9)}
</style>
</head>
<body>
  <div class="voile"></div>
  <img class="logo" src="../../assets/brand/pigeard-logo-white.svg" alt="pigeard — créateur de regards depuis 1863">

  <div class="pile">
    <div class="bande b-journees">Les journées</div>
    <div class="bande b-privilege">Privilège</div>
    <div class="bande b-dates">Du 15&nbsp;novembre au 29&nbsp;décembre</div>
  </div>

  <p class="phrase"><span class="ligne"></span><span>Une belle occasion de vous faire plaisir ou de faire un beau cadeau à&nbsp;l’approche des fêtes.</span></p>

  <div class="etoile">
    <svg viewBox="-500 -500 1000 1000" aria-hidden="true"><polygon fill="#000" points="487,-6 386,76 457,178 346,199 374,319 247,307 224,444 118,377 42,497 -39,396 -148,462 -186,350 -284,396 -294,275 -414,269 -372,140 -478,88 -395,12 -482,-96 -375,-140 -417,-256 -291,-276 -304,-389 -179,-361 -126,-473 -23,-394 43,-494 100,-386 206,-450 247,-315 370,-320 343,-206 460,-175 399,-65"/></svg>
    <div class="contenu">
      <div class="taux">-50%</div>
      <div class="sur">Sur cette sélection<br>de montures<br>de grandes<br>marques*</div>
    </div>
  </div>

  <div class="mentions">*Sur articles signalés en magasin. Voir conditions en magasin. Dispositif médical CE.</div>
</body>
</html>
